<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>FreedomTalk Architecture</title>
  <desc>FreedomTalk real-time chat and WebRTC architecture: clients, nginx/Caddy edge, horizontally scaled Fastify/Socket.IO/mediasoup API nodes, Redis adapter pub/sub, RabbitMQ async pipeline to worker and Meilisearch, Postgres with TimescaleDB, MinIO storage, and an observability lane with OpenTelemetry Collector, Jaeger, Prometheus and Grafana.</desc>

  <defs>
    <marker id="mDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="mPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="mOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="mBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="mGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="mCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="46" font-size="28" font-weight="700" fill="#0f172a">FreedomTalk Architecture</text>
  <text x="40" y="68" font-size="12" fill="#64748b">Real-time chat + WebRTC voice/video · horizontal scale · async processing pipeline · end-to-end observability</text>

  <!-- ===================== Clients ===================== -->
  <rect x="40" y="120" width="150" height="150" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="52" y="142" font-size="13" font-weight="700" fill="#0f172a">Clients</text>
  <rect x="52" y="150" width="126" height="42" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="60" y="168" font-size="10.5" font-weight="600" fill="#334155">Browser SPA</text>
  <text x="60" y="182" font-size="9.5" fill="#64748b">Next.js + React</text>
  <rect x="52" y="202" width="126" height="42" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="60" y="220" font-size="10.5" font-weight="600" fill="#334155">Mobile / desktop</text>
  <text x="60" y="234" font-size="9.5" fill="#64748b">clients</text>
  <text x="52" y="261" font-size="9.5" fill="#64748b">REST · WSS · WebRTC</text>

  <!-- ===================== Edge ===================== -->
  <rect x="250" y="140" width="140" height="110" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="262" y="162" font-size="13" font-weight="700" fill="#0f172a">nginx / Caddy</text>
  <text x="262" y="182" font-size="10" fill="#475569">TLS termination</text>
  <text x="262" y="198" font-size="10" fill="#475569">static assets</text>
  <text x="262" y="214" font-size="10" fill="#475569">rate limiting</text>
  <text x="262" y="230" font-size="10" fill="#475569">proxy /api, /socket.io</text>

  <!-- clients -> edge -->
  <line x1="194" y1="158" x2="244" y2="158" stroke="#334155" stroke-width="1.6" marker-end="url(#mDark)"/>
  <text x="200" y="151" font-size="9.5" fill="#334155" paint-order="stroke" stroke="#ffffff" stroke-width="3">HTTPS / REST</text>
  <line x1="194" y1="180" x2="244" y2="180" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mGreen)"/>
  <text x="200" y="196" font-size="9.5" fill="#059669" paint-order="stroke" stroke="#ffffff" stroke-width="3">WSS events</text>

  <!-- edge -> API node 1 -->
  <line x1="394" y1="160" x2="444" y2="160" stroke="#334155" stroke-width="1.6" marker-end="url(#mDark)"/>
  <line x1="394" y1="180" x2="444" y2="180" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mGreen)"/>
  <!-- edge -> API node 2 -->
  <line x1="394" y1="352" x2="444" y2="352" stroke="#334155" stroke-width="1.6" marker-end="url(#mDark)"/>
  <line x1="394" y1="372" x2="444" y2="372" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mGreen)"/>
  <text x="398" y="344" font-size="9.5" fill="#64748b" paint-order="stroke" stroke="#ffffff" stroke-width="3">load-balanced upstream</text>

  <!-- WebRTC media path: clients <-> SFU (bypasses proxy) -->
  <path d="M115,272 C90,350 260,300 456,232" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#mPurple)"/>
  <path d="M115,272 C100,430 260,440 456,423" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#mPurple)"/>
  <text x="170" y="356" font-size="10.5" font-weight="600" fill="#7c3aed" paint-order="stroke" stroke="#ffffff" stroke-width="4">WebRTC media — SRTP over UDP 40000-49999</text>
  <text x="170" y="370" font-size="9.5" fill="#7c3aed" paint-order="stroke" stroke="#ffffff" stroke-width="4">(direct client ↔ SFU · bypasses proxy)</text>

  <!-- ===================== API nodes ===================== -->
  <rect x="450" y="110" width="190" height="160" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="462" y="130" font-size="13" font-weight="700" fill="#0f172a">API node 1 — Fastify</text>
  <rect x="462" y="142" width="166" height="26" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="470" y="159" font-size="10.5" fill="#334155">REST API · /api/v1</text>
  <rect x="462" y="174" width="166" height="26" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="470" y="191" font-size="10.5" fill="#334155">Socket.IO · WS signaling</text>
  <rect x="462" y="206" width="166" height="52" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="470" y="226" font-size="10.5" font-weight="600" fill="#6d28d9">mediasoup SFU</text>
  <text x="470" y="242" font-size="9.5" fill="#7c3aed">RTP 40000-49999/udp</text>

  <rect x="450" y="300" width="190" height="160" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="462" y="320" font-size="13" font-weight="700" fill="#0f172a">API node 2 — Fastify</text>
  <rect x="462" y="332" width="166" height="26" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="470" y="349" font-size="10.5" fill="#334155">REST API · /api/v1</text>
  <rect x="462" y="364" width="166" height="26" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="470" y="381" font-size="10.5" fill="#334155">Socket.IO · WS signaling</text>
  <rect x="462" y="396" width="166" height="52" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="470" y="416" font-size="10.5" font-weight="600" fill="#6d28d9">mediasoup SFU</text>
  <text x="470" y="432" font-size="9.5" fill="#7c3aed">RTP 40000-49999/udp</text>

  <!-- ===================== Redis ===================== -->
  <rect x="700" y="110" width="240" height="104" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="712" y="132" font-size="13" font-weight="700" fill="#0f172a">Redis</text>
  <text x="712" y="152" font-size="10.5" fill="#475569">Socket.IO adapter pub/sub (fan-out)</text>
  <text x="712" y="168" font-size="10.5" fill="#475569">presence · sessions · rate limits</text>
  <text x="712" y="184" font-size="10.5" fill="#475569">cache</text>

  <!-- API <-> Redis -->
  <line x1="644" y1="170" x2="694" y2="170" stroke="#0891b2" stroke-width="1.6" marker-start="url(#mCyan)" marker-end="url(#mCyan)"/>
  <path d="M644,350 C676,350 670,196 694,190" fill="none" stroke="#0891b2" stroke-width="1.6" marker-start="url(#mCyan)" marker-end="url(#mCyan)"/>
  <text x="648" y="103" font-size="9.5" fill="#0891b2" paint-order="stroke" stroke="#ffffff" stroke-width="3">adapter pub/sub · presence · cache</text>

  <!-- ===================== RabbitMQ ===================== -->
  <rect x="700" y="255" width="240" height="175" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="712" y="277" font-size="13" font-weight="700" fill="#0f172a">RabbitMQ</text>
  <text x="712" y="292" font-size="10" fill="#64748b">topic exchange · freedomtalk.events</text>
  <rect x="712" y="302" width="216" height="20" rx="4" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="720" y="316" font-size="10" fill="#92400e">queue · search.messages</text>
  <rect x="712" y="328" width="216" height="20" rx="4" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="720" y="342" font-size="10" fill="#92400e">queue · embeds.generate</text>
  <rect x="712" y="354" width="216" height="20" rx="4" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="720" y="368" font-size="10" fill="#92400e">queue · notifications.mentions</text>
  <text x="712" y="418" font-size="9.5" font-style="italic" fill="#b45309">DLX → dead-letter queue (retries exhausted)</text>

  <!-- API -> RabbitMQ publish -->
  <path d="M644,240 C672,240 674,290 694,296" fill="none" stroke="#d97706" stroke-width="1.6" marker-end="url(#mOrange)"/>
  <path d="M644,430 C672,430 674,335 694,330" fill="none" stroke="#d97706" stroke-width="1.6" marker-end="url(#mOrange)"/>
  <text x="648" y="452" font-size="9.5" fill="#b45309" paint-order="stroke" stroke="#ffffff" stroke-width="3">publish</text>

  <!-- ===================== Worker + Meilisearch ===================== -->
  <rect x="700" y="470" width="110" height="56" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="755" y="494" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Worker</text>
  <text x="755" y="510" font-size="9.5" fill="#64748b" text-anchor="middle">async consumers</text>
  <rect x="830" y="470" width="110" height="56" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="885" y="494" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">Meilisearch</text>
  <text x="885" y="510" font-size="9.5" fill="#64748b" text-anchor="middle">message search</text>

  <!-- RabbitMQ -> Worker -> Meilisearch -->
  <line x1="760" y1="434" x2="760" y2="464" stroke="#d97706" stroke-width="1.6" marker-end="url(#mOrange)"/>
  <text x="768" y="452" font-size="9.5" fill="#b45309" paint-order="stroke" stroke="#ffffff" stroke-width="3">consume</text>
  <line x1="812" y1="498" x2="824" y2="498" stroke="#059669" stroke-width="1.6" marker-end="url(#mGreen)"/>

  <!-- ===================== Postgres ===================== -->
  <rect x="450" y="520" width="190" height="84" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="462" y="542" font-size="12" font-weight="700" fill="#0f172a">PostgreSQL + TimescaleDB</text>
  <text x="462" y="560" font-size="10" fill="#475569">messages hypertable</text>
  <text x="462" y="576" font-size="10" fill="#475569">servers · channels · members</text>
  <text x="462" y="592" font-size="10" fill="#475569">voice states · audit logs</text>

  <!-- API -> Postgres -->
  <path d="M470,280 C420,330 420,460 490,516" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#mBlue)"/>
  <line x1="545" y1="474" x2="545" y2="514" stroke="#2563eb" stroke-width="1.6" marker-end="url(#mBlue)"/>
  <text x="396" y="506" font-size="9.5" fill="#2563eb" paint-order="stroke" stroke="#ffffff" stroke-width="3">SQL (knex)</text>

  <!-- ===================== MinIO ===================== -->
  <rect x="700" y="555" width="240" height="60" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="712" y="577" font-size="12" font-weight="700" fill="#0f172a">MinIO object storage</text>
  <text x="712" y="594" font-size="10" fill="#475569">attachments · avatars (S3 API)</text>

  <!-- API -> MinIO -->
  <path d="M644,455 C690,470 710,510 738,549" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#mBlue)"/>
  <text x="654" y="487" font-size="9.5" fill="#2563eb" paint-order="stroke" stroke="#ffffff" stroke-width="3">S3 API</text>

  <!-- ===================== Observability lane ===================== -->
  <rect x="30" y="655" width="1150" height="115" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="44" y="672" font-size="11" font-weight="700" fill="#64748b">OBSERVABILITY</text>

  <rect x="250" y="682" width="150" height="70" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.3"/>
  <text x="325" y="712" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">OpenTelemetry</text>
  <text x="325" y="727" font-size="9.5" fill="#64748b" text-anchor="middle">collector</text>

  <rect x="450" y="682" width="130" height="70" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.3"/>
  <text x="515" y="712" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">Jaeger</text>
  <text x="515" y="727" font-size="9.5" fill="#64748b" text-anchor="middle">distributed traces</text>

  <rect x="630" y="682" width="150" height="70" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.3"/>
  <text x="705" y="712" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">Prometheus</text>
  <text x="705" y="727" font-size="9.5" fill="#64748b" text-anchor="middle">time-series metrics</text>

  <rect x="830" y="682" width="140" height="70" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.3"/>
  <text x="900" y="712" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">Grafana</text>
  <text x="900" y="727" font-size="9.5" fill="#64748b" text-anchor="middle">dashboards · alerts</text>

  <!-- API -> OTel -->
  <path d="M455,470 C420,560 350,600 330,676" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#mGray)"/>
  <text x="374" y="566" font-size="9.5" fill="#64748b" text-anchor="end" paint-order="stroke" stroke="#ffffff" stroke-width="3">OTLP traces · metrics</text>

  <!-- OTel -> Jaeger, OTel -> Prometheus, Prometheus -> Grafana -->
  <line x1="404" y1="717" x2="444" y2="717" stroke="#64748b" stroke-width="1.3" marker-end="url(#mGray)"/>
  <path d="M404,700 C480,662 560,662 624,695" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#mGray)"/>
  <text x="478" y="660" font-size="9" fill="#64748b" paint-order="stroke" stroke="#ffffff" stroke-width="3">remote_write</text>
  <line x1="784" y1="717" x2="824" y2="717" stroke="#64748b" stroke-width="1.3" marker-end="url(#mGray)"/>

  <!-- ===================== Legend ===================== -->
  <rect x="960" y="100" width="200" height="190" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="972" y="122" font-size="12" font-weight="700" fill="#0f172a">Legend</text>

  <line x1="972" y1="140" x2="1006" y2="140" stroke="#334155" stroke-width="1.6" marker-end="url(#mDark)"/>
  <text x="1014" y="144" font-size="9.5" fill="#475569">HTTP / REST</text>

  <line x1="972" y1="162" x2="1006" y2="162" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mGreen)"/>
  <text x="1014" y="166" font-size="9.5" fill="#475569">WebSocket (WSS)</text>

  <line x1="972" y1="184" x2="1006" y2="184" stroke="#7c3aed" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#mPurple)"/>
  <text x="1014" y="188" font-size="9.5" fill="#475569">WebRTC media (UDP)</text>

  <line x1="972" y1="206" x2="1006" y2="206" stroke="#d97706" stroke-width="1.6" marker-end="url(#mOrange)"/>
  <text x="1014" y="210" font-size="9.5" fill="#475569">AMQP events (RabbitMQ)</text>

  <line x1="972" y1="228" x2="1006" y2="228" stroke="#2563eb" stroke-width="1.6" marker-end="url(#mBlue)"/>
  <text x="1014" y="232" font-size="9.5" fill="#475569">database / storage I/O</text>

  <line x1="972" y1="250" x2="1006" y2="250" stroke="#64748b" stroke-width="1.3" marker-end="url(#mGray)"/>
  <text x="1014" y="254" font-size="9.5" fill="#475569">telemetry (OTLP)</text>

  <line x1="972" y1="272" x2="1006" y2="272" stroke="#0891b2" stroke-width="1.6" marker-start="url(#mCyan)" marker-end="url(#mCyan)"/>
  <text x="1014" y="276" font-size="9.5" fill="#475569">pub/sub · presence (Redis)</text>

  <!-- footer -->
  <text x="40" y="790" font-size="9.5" fill="#94a3b8">FreedomTalk monorepo — packages/api (Fastify + Socket.IO + mediasoup) · packages/web (Next.js) · packages/shared · Socket.IO scaled via Redis adapter; async jobs via RabbitMQ topic exchange freedomtalk.events</text>
</svg>
