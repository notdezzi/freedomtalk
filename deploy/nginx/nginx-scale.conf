# nginx edge for the scaled stack (docker-compose.scale.yml).
#
# ip_hash pins a client's requests (including its WebSocket upgrade) to
# one API node. The Socket.io Redis adapter makes either node able to
# reach every subscriber, so sticky sessions are only needed to keep
# long-polling fallback coherent — with websocket-only transports they
# are optional, but cheap and safe here.

upstream freedomtalk_api {
    ip_hash;
    server api-1:3000;
    server api-2:3000;
}

server {
    listen 80;

    # REST API
    location /api/ {
        proxy_pass http://freedomtalk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io (WebSocket upgrade + long-polling fallback)
    location /socket.io/ {
        proxy_pass http://freedomtalk_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Everything else is the SPA/SSR web client (added by prod stack;
    # for the scale stack alone, API answers directly).
    location / {
        proxy_pass http://freedomtalk_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
